name: 🚀 Deploy TVC Educate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and Build
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json
        
    - name: 📦 Install client dependencies
      run: |
        cd client
        npm ci
        
    - name: 🧪 Run server tests
      run: |
        cd server
        npm test --if-present || echo "No tests found, continuing..."
        
    - name: 🧪 Run client tests
      run: |
        cd client
        npm test --if-present || echo "No tests found, continuing..."
        
    - name: 🔍 Lint server code
      run: |
        cd server
        npm run lint --if-present || echo "No linting configured, continuing..."
        
    - name: 🔍 Lint client code
      run: |
        cd client
        npm run lint --if-present || echo "No linting configured, continuing..."
        
    - name: 🏗️ Build client
      run: |
        cd client
        npm run build:prod
        
    - name: 📦 Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ env.IMAGE_NAME }}:latest .
        
    - name: 🏷️ Log in to Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📤 Push Docker image
      if: github.event_name == 'push'
      run: |
        docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.IMAGE_NAME }}:latest

  # Deploy to Staging
  deploy-staging:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
        
    - name: 🚀 Deploy to staging server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          cd /opt/tvc-educate
          git pull origin develop
          docker-compose pull
          docker-compose up -d
          docker system prune -f
        EOF

  # Deploy to Production
  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
        
    - name: 🔐 Setup SSL (if needed)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/tvc-educate
          if [ ! -f ssl/cert.pem ]; then
            echo "🔒 Setting up SSL certificate..."
            chmod +x ssl-setup.sh
            ./ssl-setup.sh ${{ secrets.DOMAIN }} ${{ secrets.ADMIN_EMAIL }}
          fi
        EOF
        
    - name: 🚀 Deploy to production server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/tvc-educate
          
          # Backup current deployment
          if [ -d "backup" ]; then
            rm -rf backup
          fi
          mkdir -p backup
          cp -r server backup/ 2>/dev/null || true
          cp -r client/build backup/ 2>/dev/null || true
          
          # Pull latest code
          git pull origin main
          
          # Update environment variables
          if [ -f ".env.production" ]; then
            cp .env.production server/.env
            cp .env.production client/.env
          fi
          
          # Deploy with Docker Compose
          docker-compose pull
          docker-compose up -d
          
          # Health check
          sleep 30
          if curl -f https://${{ secrets.DOMAIN }}/health; then
            echo "✅ Deployment successful!"
            # Clean up backup
            rm -rf backup
          else
            echo "❌ Deployment failed, rolling back..."
            docker-compose down
            if [ -d "backup" ]; then
              cp -r backup/server ./
              cp -r backup/build ./client/
              docker-compose up -d
            fi
            exit 1
          fi
          
          # Clean up old images
          docker system prune -f
        EOF
        
    - name: 📊 Post-deployment checks
      run: |
        # Wait for deployment to stabilize
        sleep 60
        
        # Health check
        curl -f https://${{ secrets.DOMAIN }}/health
        
        # Performance check
        curl -w "@curl-format.txt" -o /dev/null -s https://${{ secrets.DOMAIN }}/
        
    - name: 📧 Send notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run security scan
      if: secrets.SNYK_TOKEN != ''
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        file: server/package.json
      continue-on-error: true 